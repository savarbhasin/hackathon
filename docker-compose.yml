services:
  redis:
    image: redis:7-alpine
    container_name: mission-control-redis
    ports:
      - "127.0.0.1:6390:6379"
    command:
      [
        "redis-server",
        "--maxmemory-policy",
        "noeviction",
        "--save",
        "",
        "--appendonly",
        "no",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
